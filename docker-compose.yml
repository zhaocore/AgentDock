services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-dutybot}
      MYSQL_USER: ${MYSQL_USER:-dutybot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dutybot}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-dutybot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dutybot}
      MYSQL_DB: ${MYSQL_DB:-dutybot}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      REPO_ROOT_DIR: /data/repo
      AGENT_CONFIG_DIR: /app/agents
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY required}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL required}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      SERVER_MODE: release
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - repodata:/data/repo
      - ./agents:/app/agents:ro

volumes:
  mysqldata:
  repodata:
